<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Hundred RL Training</title>
    <!-- Chart.js for Loss Graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            color: #f1c40f;
            margin-bottom: 5px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .game-board {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #27ae60;
            border-radius: 15px;
            border: 5px solid #1e824c;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .player {
            position: absolute;
            width: auto;
            min-width: 200px;
            /* Reduced min-width to avoid huge boxes on side */
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            /* Ensure players are above other elements */
        }

        .hand {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: -25px;
            margin-top: 5px;
            /* Ensure hand container is big enough */
            min-height: 110px;
        }

        .card {
            display: inline-block;
            width: 70px;
            /* Standard logic: Cards are usually 2.5x3.5 ratio */
            height: 100px;
            background: transparent;
            border-radius: 5px;
            box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Negative margin for overlap effect */
            margin-left: -25px;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card:hover {
            transform: translateY(-20px) scale(1.1);
            z-index: 100;
        }

        /* Specific Player positions */
        .p0 {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Bot 1 (Left): Vertical Column */
        .p1 {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            /* Limit width so it doesn't span too wide */
            width: 120px;
            min-width: 0;
        }

        .p1 .hand {
            flex-direction: column;
            gap: 0;
            min-height: auto;
        }

        .p1 .card {
            margin-left: 0;
            margin-top: -70px;
            /* Vertical Overlap */
        }

        .p1 .card:first-child {
            margin-top: 0;
        }

        /* Hover effect adjustment for vertical */
        .p1 .card:hover {
            transform: translateX(20px);
            z-index: 100;
        }

        .p2 {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Bot 3 (Right): Vertical Column */
        .p3 {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            min-width: 0;
        }

        .p3 .hand {
            flex-direction: column;
            gap: 0;
            min-height: auto;
        }

        .p3 .card {
            margin-left: 0;
            margin-top: -70px;
        }

        .p3 .card:first-child {
            margin-top: 0;
        }

        .p3 .card:hover {
            transform: translateX(-20px);
            z-index: 100;
        }

        .center-table {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .trick-card {
            width: 80px;
            height: 115px;
            position: absolute;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Fix trick card positions to be more central but offset */
        .tc-0 {
            bottom: 20px;
            z-index: 4;
        }

        .tc-1 {
            left: 20px;
            z-index: 3;
        }

        .tc-2 {
            top: 20px;
            z-index: 2;
        }

        .tc-3 {
            right: 20px;
            z-index: 1;
        }

        .sidebar {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
        }

        .log-box {
            height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            color: #ecf0f1;
        }

        .log-entry {
            margin-bottom: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <h1>Five Hundred Training Visualizer</h1>
    <div id="controls">
        <button id="btn-start" onclick="toggleRun(true)"
            style="padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">START
            TRAINING</button>
        <button id="btn-stop" onclick="toggleRun(false)"
            style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; display: none; font-size: 16px; font-weight: bold;">PAUSE</button>
    </div>
    <div id="status">Connecting...</div>

    <div class="main-container">
        <!-- Game Board -->
        <div class="game-board">
            <div class="center-table" id="trick-area"></div>

            <div class="player p0" id="p0">
                <div class="name">Agent (You)</div>
                <div class="hand" id="h0"></div>
            </div>
            <div class="player p1" id="p1">
                <div class="name">Bot 1</div>
                <div class="hand" id="h1"></div>
            </div>
            <div class="player p2" id="p2">
                <div class="name">Bot 2 (Partner)</div>
                <div class="hand" id="h2"></div>
            </div>
            <div class="player p3" id="p3">
                <div class="name">Bot 3</div>
                <div class="hand" id="h3"></div>
            </div>
        </div>

        <!-- Sidebar (Stats, Logs, Graph) -->
        <div class="sidebar">
            <div class="panel">
                <h3>Scores & Contract</h3>
                <div>Agent Team: <span id="s0">0</span></div>
                <div>Bots Team: <span id="s1">0</span></div>
                <div>Contract: <span id="contract">-</span></div>
            </div>

            <div class="panel">
                <h3>Metrics</h3>
                <div>Episodes: <span id="total-episodes">0</span></div>
                <div>Total Steps: <span id="total-steps">0</span></div>
            </div>

            <div class="panel">
                <h3>Training Loss</h3>
                <canvas id="lossChart" width="380" height="200"></canvas>
            </div>

            <div class="panel">
                <h3>Episode Reward</h3>
                <canvas id="rewardChart" width="380" height="200"></canvas>
            </div>

            <div class="panel">
                <h3>Win Rate (Total Games)</h3>
                <canvas id="winChart" width="380" height="200"></canvas>
            </div>

            <div class="panel">
                <h3>Game Log</h3>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        // Chart Switch
        let lossChart = null;
        let rewardChart = null;
        let winChart = null;

        function initCharts() {
            // Loss Chart
            const ctxLoss = document.getElementById('lossChart').getContext('2d');
            lossChart = new Chart(ctxLoss, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Loss',
                        data: [],
                        borderColor: '#e74c3c',
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: {
                            beginAtZero: true,
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });

            // Reward Chart
            const ctxReward = document.getElementById('rewardChart').getContext('2d');
            rewardChart = new Chart(ctxReward, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Total Reward',
                        data: [],
                        borderColor: '#2ecc71',
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: {
                            beginAtZero: false,
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });

            // Win Chart (Bar/Pie)
            const ctxWin = document.getElementById('winChart').getContext('2d');
            winChart = new Chart(ctxWin, {
                type: 'bar', // or 'doughnut'
                data: {
                    labels: ['Agent Team', 'Bot Team'],
                    datasets: [{
                        label: 'Wins',
                        data: [0, 0],
                        backgroundColor: ['#2ecc71', '#e74c3c'],
                        borderColor: ['#27ae60', '#c0392b'],
                        borderWidth: 1
                    }]
                },
                options: {
                    animation: false,
                    indexAxis: 'y', // Horizontal bars
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        y: {
                            ticks: { color: 'white' },
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function updateCharts(lossData, rewardData, winStats) {
            if (lossChart && lossData) {
                lossChart.data.labels = lossData.map((_, i) => i);
                lossChart.data.datasets[0].data = lossData;
                lossChart.update();
            }
            if (rewardChart && rewardData) {
                rewardChart.data.labels = rewardData.map((_, i) => i);
                rewardChart.data.datasets[0].data = rewardData;
                rewardChart.update();
            }
            if (winChart && winStats) {
                // winStats = { "Agent": X, "Bots": Y }
                winChart.data.datasets[0].data = [winStats['Agent'] || 0, winStats['Bots'] || 0];
                winChart.update();
            }
        }

        function renderCard(cardObj) {
            const el = document.createElement('div');
            el.className = 'card';

            let rank = cardObj.rank;
            let suit = cardObj.suit;

            // Map to API codes
            const rankMap = { 'TEN': '0', 'KING': 'K', 'QUEEN': 'Q', 'JACK': 'J', 'ACE': 'A', 'NINE': '9', 'EIGHT': '8', 'SEVEN': '7', 'SIX': '6', 'FIVE': '5', 'FOUR': '4' };
            const suitMap = { 'HEARTS': 'H', 'DIAMONDS': 'D', 'CLUBS': 'C', 'SPADES': 'S' };

            if (rank === 'JOKER') {
                // Custom Joker
                el.style.backgroundColor = 'white';
                el.style.color = 'black';
                el.style.fontSize = '14px';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.innerText = 'JOKER';
                el.style.border = '2px solid purple';
            } else {
                let rCode = rankMap[rank];
                let sCode = suitMap[suit];
                if (rCode && sCode) {
                    const img = document.createElement('img');
                    img.src = `https://deckofcardsapi.com/static/img/${rCode}${sCode}.png`;
                    el.appendChild(img);
                } else {
                    el.innerText = '?';
                }
            }
            return el;
        }

        async function toggleRun(running) {
            await fetch('/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ running: running })
            });
            updateUIButtons(running);
        }

        function updateUIButtons(running) {
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            if (running) {
                btnStart.style.display = 'none';
                btnStop.style.display = 'inline-block';
            } else {
                btnStart.style.display = 'inline-block';
                btnStart.innerText = 'RESUME TRAINING';
                btnStop.style.display = 'none';
            }
        }

        function renderLogs(logs) {
            const box = document.getElementById('log-box');
            // Check if scrolled to bottom
            const isScrolledToBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 10;

            box.innerHTML = logs.map(l => `<div class="log-entry">${l}</div>`).join('');

            if (isScrolledToBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        async function update() {
            try {
                const res = await fetch('/state');
                const state = await res.json();

                if (state.control) updateUIButtons(state.control.running);

                document.getElementById('status').innerText = `Phase: ${state.phase || 'Waiting'} | Trump: ${state.trump || '-'}`;
                document.getElementById('contract').innerText = state.contract || '-';
                if (state.steps !== undefined) {
                    document.getElementById('total-steps').innerText = state.steps;
                }
                if (state.episodes !== undefined) {
                    document.getElementById('total-episodes').innerText = state.episodes;
                }

                if (state.scores) {
                    document.getElementById('s0').innerText = state.scores[0];
                    document.getElementById('s1').innerText = state.scores[1];
                }

                // Hands (Using new JSON format)
                if (state.hands) {
                    for (let i = 0; i < 4; i++) {
                        const hDiv = document.getElementById(`h${i}`);
                        hDiv.innerHTML = '';
                        const hand = state.hands[i];
                        if (Array.isArray(hand)) {
                            hand.forEach(c => hDiv.appendChild(renderCard(c)));
                        } else {
                            hDiv.innerText = `${hand} cards`;
                        }
                    }
                }

                // Trick
                const trickArea = document.getElementById('trick-area');
                trickArea.innerHTML = '';
                if (state.trick) {
                    state.trick.forEach((tData) => {
                        const cDiv = renderCard(tData.card);
                        cDiv.className += ` trick-card tc-${tData.player}`;
                        trickArea.appendChild(cDiv);
                    });
                }

                // Logs
                if (state.logs) renderLogs(state.logs);

                // Graphs
                updateCharts(state.loss, state.reward, state.win_stats);

            } catch (e) {
                console.error(e);
            }
            setTimeout(update, 500);
        }

        initCharts();
        update();
    </script>
</body>

</html>
