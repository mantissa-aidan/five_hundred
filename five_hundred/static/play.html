<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arena - Human vs Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            /* Prevent scrollbar jumping */
        }

        h1 {
            margin-bottom: 5px;
            text-align: center;
            width: 100%;
        }

        #status-bar {
            color: #f1c40f;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .game-board {
            position: relative;
            width: 100%;
            /* Responsive */
            max-width: 1100px;
            /* Wider play area */
            height: 650px;
            background-color: #27ae60;
            border-radius: 15px;
            border: 10px solid #1e824c;
            /* Thicker felt border */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            /* Deeper shadow */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player {
            position: absolute;
            width: auto;
            min-width: 200px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .hand {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: -40px;
            /* Tighter overlap */
            margin-top: 5px;
            min-height: 110px;
        }

        .card {
            display: inline-block;
            width: 80px;
            height: 115px;
            background: transparent;
            border-radius: 5px;
            box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            margin-left: -40px;
            cursor: pointer;
            /* Interactive */
        }

        .card:first-child {
            margin-left: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card:hover {
            transform: translateY(-20px) scale(1.1);
            z-index: 100;
            border: 2px solid yellow;
        }

        /* Player Positions */
        .p0 {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .p1 {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
        }

        .p2 {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .p3 {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
        }

        /* Center Table */
        .center-table {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .trump-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            /* Darker background */
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 50;
            color: white;
            min-width: 100px;
            width: auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .hud-emoji {
            font-size: 36px;
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
            color: black;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .hud-text {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .hud-sub {
            margin-top: 8px;
            display: flex;
            gap: 4px;
        }

        .trick-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .trick-dot.won-us {
            background: #2ecc71;
            box-shadow: 0 0 5px #2ecc71;
        }

        .trick-dot.won-them {
            background: #e74c3c;
            box-shadow: 0 0 5px #e74c3c;
        }

        .trick-dot.contract-mark {
            border: 2px solid gold;
            transform: scale(1.2);
        }

        /* Tug of War Bar */
        .tow-container {
            width: 100%;
            height: 12px;
            background: #34495e;
            border-radius: 6px;
            margin: 10px 0;
            position: relative;
            overflow: visible;
            /* Allow marker to overhang */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tow-bar {
            height: 100%;
            width: 50%;
            /* Default center */
            background: linear-gradient(90deg, #2ecc71 0%, #2ecc71 100%);
            border-radius: 6px 0 0 6px;
            /* Just left side filled? No, let's do marker style */
            display: none;
        }

        .tow-marker {
            width: 4px;
            height: 18px;
            background: white;
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 5px white;
            z-index: 2;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tow-fill-left {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(46, 204, 113, 0.6);
            border-radius: 6px 0 0 6px;
            width: 50%;
            transition: width 0.5s ease;
        }

        .tow-fill-right {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            background: rgba(231, 76, 60, 0.6);
            border-radius: 0 6px 6px 0;
            width: 50%;
            transition: width 0.5s ease;
        }



        .trick-card {
            width: 90px;
            height: 130px;
            position: absolute;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pop-in 0.4s ease-out;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .fly-0 {
            animation: fly-in-0 0.5s ease-out both;
        }

        .fly-1 {
            animation: fly-in-1 0.5s ease-out both;
        }

        .fly-2 {
            animation: fly-in-2 0.5s ease-out both;
        }

        .fly-3 {
            animation: fly-in-3 0.5s ease-out both;
        }

        @keyframes fly-in-0 {
            from {
                transform: translateY(300px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fly-in-1 {
            from {
                transform: translateX(-300px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fly-in-2 {
            from {
                transform: translateY(-300px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fly-in-3 {
            from {
                transform: translateX(300px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .tc-0 {
            bottom: 10px;
            z-index: 4;
        }

        .tc-1 {
            left: 10px;
            z-index: 3;
        }

        .tc-2 {
            top: 10px;
            z-index: 2;
        }

        .tc-3 {
            right: 10px;
            z-index: 1;
        }

        /* Action Panel Embedded */
        #action-panel {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid gold;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 0;
            width: 100%;
        }

        .btn-group {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .suit-btn.H {
            background: #e74c3c;
            color: white;
        }

        .suit-btn.D {
            background: #e67e22;
            color: white;
        }

        .suit-btn.C {
            background: #2c3e50;
            color: white;
            border: 1px solid #7f8c8d;
        }

        .suit-btn.S {
            background: #34495e;
            color: white;
            border: 1px solid #7f8c8d;
        }

        .suit-btn.NT {
            background: #9b59b6;
            color: white;
        }

        .num-btn {
            background: #bdc3c7;
            color: #2c3e50;
        }

        .num-btn.selected {
            background: #f1c40f;
            color: black;
            border: 2px solid white;
        }

        .action-submit {
            background: #27ae60;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            margin-top: 10px;
        }

        .action-pass {
            background: #c0392b;
            color: white;
        }

        /* Info Panel */
        .info-panel {
            background: rgba(0, 0, 0, 0.85);
            color: #ecf0f1;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Trick History Items */
        .trick-item {
            padding: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            cursor: pointer;
        }

        .trick-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .trick-tooltip {
            display: none;
            position: fixed;
            width: 200px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #f1c40f;
            padding: 10px;
            border-radius: 8px;
            z-index: 2000;
            pointer-events: none;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Modal Styles */
        #round-result-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: #34495e;
            margin: 10% auto;
            padding: 25px;
            border: 2px solid #f1c40f;
            width: 320px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: modal-fade-in 0.3s ease-out;
        }

        @keyframes modal-fade-in {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 20px;
            color: #f1c40f;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .modal-body {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: #27ae60;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <h1>Play 500 🃏</h1>
    <div id="status-bar">Waiting for server...</div>

    <div class="layout-container"
        style="display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; max-width: 1600px;">
        <div class="game-board">
            <!-- Info Panel was here -->

            <!-- HUD Panel -->
            <div id="table-hud" class="trump-icon" style="display:none;">
                <div id="hud-contract" class="hud-text"></div>
                <div id="hud-icon" class="hud-emoji"></div>
                <!-- Trick Dots Container -->
                <div id="hud-progress" class="hud-sub">
                    <!-- Dots injected by JS -->
                </div>
            </div>

            <div class="center-table" id="trick-area"></div>

            <div class="player p0">
                <div class="name">YOU (Human)</div>
                <div class="hand" id="h0"></div>
            </div>
            <div class="player p1">
                <div class="name">Agent 1</div>
                <div class="hand" id="h1"></div>
            </div>
            <div class="player p2">
                <div class="name">Partner (Agent)</div>
                <div class="hand" id="h2"></div>
            </div>
            <div class="player p3">
                <div class="name">Agent 3</div>
                <div class="hand" id="h3"></div>
            </div>

        </div> <!-- End Game Board -->

        <!-- Info Sidebar -->
        <div class="info-panel"
            style="position: static; width: 300px; height: 650px; box-sizing: border-box; display:flex; flex-direction:column;">
            <h3 style="margin-top:0; border-bottom:1px solid rgba(255,255,255,0.3); padding-bottom:5px;">Game Info</h3>

            <!-- Score Board -->
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
                <span style="color:#2ecc71">YOU: <span id="my-score">0</span></span>
                <span style="color:#e74c3c">THEM: <span id="opp-score">0</span></span>
            </div>

            <!-- Tug of War -->
            <div class="tow-container" title="Score Balance">
                <div class="tow-fill-left" id="tow-left"></div>
                <div class="tow-fill-right" id="tow-right"></div>
                <div class="tow-marker" id="tow-marker"></div>
            </div>

            <div>Phase: <span id="game-phase">-</span></div>
            <div style="margin-top:10px;"><span id="game-contract-label">Contract:</span> <span
                    id="game-contract">-</span></div>
            <div>Trump: <span id="game-trump">-</span></div>
            <div id="round-status" style="margin-top:10px; font-weight:bold; color:#f1c40f; font-size:16px;">Tricks: 0 -
                0</div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.3); margin: 15px 0;">

            <strong>Bidding History</strong>
            <div id="bid-log"
                style="height: 100px; overflow-y: auto; font-size: 11px; white-space: nowrap; background:rgba(0,0,0,0.3); padding:5px; border-radius:4px; margin-top:5px; margin-bottom: 10px;">
            </div>

            <strong>Trick History (Hover)</strong>
            <div id="trick-log"
                style="flex-grow:1; overflow-y: auto; font-size: 12px; background:rgba(0,0,0,0.3); padding:5px; border-radius:4px; margin-top:5px; margin-bottom: 20px;">
            </div>

            <!-- Action Area (Moved to Sidebar) -->
            <div id="action-panel">
                <h2 id="action-title" style="margin-top:0; font-size:18px;">Your Turn</h2>
                <div id="error-display"
                    style="display:none; color:#e74c3c; background:rgba(231,76,60,0.1); padding:8px; border-radius:4px; margin-bottom:10px; font-size:12px; border:1px solid #e74c3c;">
                </div>
                <div id="bid-controls" style="display:none;">
                    <div class="btn-group" style="gap:5px;">
                        <button class="num-btn" onclick="selBidNum(6)">6</button>
                        <button class="num-btn" onclick="selBidNum(7)">7</button>
                        <button class="num-btn" onclick="selBidNum(8)">8</button>
                        <button class="num-btn" onclick="selBidNum(9)">9</button>
                        <button class="num-btn" onclick="selBidNum(10)">10</button>
                    </div>
                    <div class="btn-group" style="gap:5px;">
                        <button class="suit-btn S" onclick="submitBid('SPADES')">♠</button>
                        <button class="suit-btn C" onclick="submitBid('CLUBS')">♣</button>
                        <button class="suit-btn D" onclick="submitBid('DIAMONDS')">♦</button>
                        <button class="suit-btn H" onclick="submitBid('HEARTS')">♥</button>
                        <button class="suit-btn NT" onclick="submitBid('NT')">NT</button>
                    </div>
                    <div class="btn-group">
                        <button class="action-pass" onclick="submitPass()">PASS</button>
                    </div>
                </div>

                <div id="play-msg" style="display:none;">
                    <p style="margin:5px 0;">Play a card!</p>
                </div>

                <div id="kitty-controls" style="display:none;">
                    <p>Discard 3 cards.</p>
                    <button class="action-submit" onclick="submitDiscards()">Confirm</button>
                </div>

                <div id="next-trick-controls" style="display:none;">
                    <button class="action-submit" style="background:#3498db; font-size: 16px; width:100%;"
                        onclick="submitNextTrick()">Next Trick ➡️</button>
                </div>
            </div>
        </div>
    </div> <!-- End Layout Container -->
    <div id="global-trick-tooltip" class="trick-tooltip"></div>

    <script>
        let currentBidNum = 6;
        let lastState = null;
        let selectedDiscards = [];
        let pendingContext = null;

        function selBidNum(n) {
            currentBidNum = n;
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function showTrickTooltip(event, trickIdx) {
            if (!lastState || !lastState.finished_tricks) return;
            const trick = lastState.finished_tricks[trickIdx];
            if (!trick) return;

            const tooltip = document.getElementById('global-trick-tooltip');

            let cardsHtml = "";
            const suitEmojis = {
                'HEARTS': '❤️',
                'DIAMONDS': '♦️',
                'CLUBS': '♣️',
                'SPADES': '♠️',
                'NO_TRUMP': '🃏'
            };

            trick.cards.forEach((c, cIdx) => {
                const pName = c[0];
                const cStr = c[1];
                const cRank = c[2];
                const cSuit = c[3];

                let emoji = suitEmojis[cSuit] || '';
                if (cRank === 'JOKER') emoji = '🃏';

                let color = (cSuit === 'HEARTS' || cSuit === 'DIAMONDS') ? '#e74c3c' : '#ecf0f1';
                if (cSuit === 'NO_TRUMP' || cRank === 'JOKER') color = '#9b59b6';

                let pStyle = "";
                let cardIcon = "";
                if (pName === trick.winner && cStr === trick.winning_card) {
                    pStyle = "font-weight:bold; color:#f1c40f;";
                    cardIcon = " ⭐";
                }

                const isLead = (cIdx === 0) ? ' <span style="opacity:0.6; font-size:9px;">(Lead)</span>' : '';

                cardsHtml += `<div style="font-size:11px; margin-bottom:3px; display:flex; justify-content:space-between; align-items:center;">
                    <span style="${pStyle}">${pName}${isLead}:</span> 
                    <span style="color:${color}; display:flex; align-items:center; gap:4px;">
                        ${emoji} ${cStr}${cardIcon}
                    </span>
                 </div>`;
            });

            tooltip.innerHTML = `
                <div style="font-weight:bold; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:4px; font-size:13px; color:#f1c40f;">
                    Trick ${trickIdx + 1} History
                </div>
                ${cardsHtml}
            `;

            // Position it to the left of the item
            const rect = event.currentTarget.getBoundingClientRect();
            tooltip.style.display = 'block';
            tooltip.style.top = rect.top + 'px';
            tooltip.style.left = (rect.left - 220) + 'px';
        }

        function hideTrickTooltip() {
            document.getElementById('global-trick-tooltip').style.display = 'none';
        }

        async function sendAction(data) {
            document.getElementById('action-panel').style.display = 'none';
            await fetch('/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        function submitBid(suit) {
            sendAction({ action: 'bid', tricks: currentBidNum, suit: suit });
        }

        function submitPass() {
            sendAction({ action: 'pass' });
        }

        function submitDiscards() {
            if (selectedDiscards.length !== 3) {
                alert("Please select exactly 3 cards to discard.");
                return;
            }
            // Send indices
            sendAction({ indices: selectedDiscards });
            selectedDiscards = [];
        }

        function submitNextTrick() {
            sendAction({ action: 'next_trick' });
        }

        function onCardClick(index) {
            if (pendingContext === 'PLAY') {
                sendAction({ card_index: index });
            } else if (pendingContext === 'KITTY') {
                // Toggle selection
                const handDiv = document.getElementById('h0');
                const cardDiv = handDiv.children[index];

                if (selectedDiscards.includes(index)) {
                    selectedDiscards = selectedDiscards.filter(i => i !== index);
                    cardDiv.style.border = "none";
                    cardDiv.style.transform = "translateY(0)";
                } else {
                    if (selectedDiscards.length < 3) {
                        selectedDiscards.push(index);
                        cardDiv.style.border = "2px solid red";
                        cardDiv.style.transform = "translateY(-20px)";
                    }
                }
            }
        }

        function renderCard(cardObj, index, isHuman, forceFaceUp = false) {
            const el = document.createElement('div');
            el.className = 'card';

            if (isHuman) {
                el.onclick = () => onCardClick(index);
            }

            // Hide non-human cards unless forced (e.g. for trick)
            if (!isHuman && !forceFaceUp) {
                const img = document.createElement('img');
                // Generic card back
                img.src = 'https://deckofcardsapi.com/static/img/back.png';
                el.appendChild(img);
                return el;
            }

            let rank = cardObj.rank;
            // ... (rest of logic is fine, jump to trick loop)
            // We need to apply this in two places, so let's do this via chunks or careful multireplace if needed.
            // Actually, standard tool is better. I will update the function first.
            let suit = cardObj.suit;

            // Allow simplified strings from Python str(card) if needed, 
            // but we expect serialized dict from server {rank: "ACE", suit: "SPADES"}

            const rankMap = { 'TEN': '0', 'KING': 'K', 'QUEEN': 'Q', 'JACK': 'J', 'ACE': 'A', 'NINE': '9', 'EIGHT': '8', 'SEVEN': '7', 'SIX': '6', 'FIVE': '5', 'FOUR': '4' };
            const suitMap = { 'HEARTS': 'H', 'DIAMONDS': 'D', 'CLUBS': 'C', 'SPADES': 'S' };

            if (rank === 'JOKER') {
                el.innerText = 'JK';
                el.style.border = '2px solid purple';
                el.style.background = "white";
                el.style.color = "black";
                el.style.display = "flex";
                el.style.alignItems = "center";
                el.style.justifyContent = "center";
            } else {
                let rCode = rankMap[rank];
                let sCode = suitMap[suit];
                if (rCode && sCode) {
                    const img = document.createElement('img');
                    img.src = `https://deckofcardsapi.com/static/img/${rCode}${sCode}.png`;
                    el.appendChild(img);
                }
            }
            return el;
        }

        async function updateState() {
            try {
                const res = await fetch('/arena_state');
                const jsonParams = await res.json();

                const state = jsonParams.game_state;
                const pending = jsonParams.pending_action;
                lastState = state;

                // Update Info
                document.getElementById('my-score').innerText = state.scores ? state.scores[0] : 0;
                document.getElementById('opp-score').innerText = state.scores ? state.scores[1] : 0;
                document.getElementById('game-phase').innerText = state.phase;

                // Show Current Bid during Bidding, Contract during Play
                if (state.phase === 'BID') {
                    document.getElementById('game-contract-label').innerText = "Current Bid:";
                    document.getElementById('game-contract').innerText = state.highest_bid || "None";
                } else {
                    document.getElementById('game-contract-label').innerText = "Contract:";
                    document.getElementById('game-contract').innerText = state.contract || "-";
                }

                document.getElementById('game-trump').innerText = state.trump || '-';

                // Update Table HUD
                const hud = document.getElementById('table-hud');
                if (state.phase === 'PLAY' && state.contract) {
                    hud.style.display = 'flex';

                    const suitEmojis = {
                        'HEARTS': '❤️',
                        'DIAMONDS': '♦️',
                        'CLUBS': '♣️',
                        'SPADES': '♠️',
                        'NO_TRUMP': '🃏',
                        'NT': '🃏'
                    };

                    // Parse contract string from "Bot2 bids 7 Hearts..." or utilize explicit fields
                    // Using new fields from env.py if available, else regex
                    let suitStr = state.contract_suit || "";
                    if (!suitStr && state.trump) suitStr = state.trump.replace('Suit.', '');

                    let level = state.contract_level || "?";
                    // Fallback parse if env not updated yet (async reload)
                    if (level === "?" && state.contract) {
                        const match = state.contract.match(/(\d+)/);
                        if (match) level = match[1];
                    }


                    // Icon
                    const emoji = suitEmojis[suitStr] || suitStr;
                    document.getElementById('hud-icon').innerText = emoji;

                    // Contract Text
                    document.getElementById('hud-contract').innerText = `${level} ${suitStr}`;

                    // Trick Progression Dots
                    const pContainer = document.getElementById('hud-progress');
                    pContainer.innerHTML = ''; // Clear

                    if (state.tricks_won) {
                        const usWins = state.tricks_won[0];
                        const themWins = state.tricks_won[1];
                        const contractTarget = parseInt(level) || 0;

                        // We always have 10 tricks
                        for (let i = 1; i <= 10; i++) {
                            const d = document.createElement('div');
                            d.className = 'trick-dot';

                            // Color logic: "Us" fills from left? Or distinct?
                            // Let's just color the first N dots Green, next M dots Red?
                            // Or better: Current trick count?
                            // Issue: We don't know ORDER of wins from this simple count. 
                            // But usually you just show counts.
                            // Left side: Us wins. Right side: Them wins. Middle: Empty

                            // But wait, "Progression" implies sequence. 
                            // Without history of WHO won WHICH trick, we can't do sequence.
                            // Stacking is standard.

                            if (i <= usWins) {
                                d.classList.add('won-us');
                            } else if (i > (10 - themWins)) {
                                d.classList.add('won-them');
                            }

                            // Mark contract goal
                            // e.g. if contract is 7, the 7th dot is special IF we are attacking.
                            // Assuming "Us" (Human) is attacking for now or we just highlight 7th dot always?
                            // Better: Highlight index = contractTarget
                            if (contractTarget > 0 && i === contractTarget) {
                                d.classList.add('contract-mark');
                                d.title = `Contract Target: ${contractTarget}`;
                            }

                            pContainer.appendChild(d);
                        }
                    }
                } else {
                    hud.style.display = 'none';
                }

                document.getElementById('status-bar').innerText = pending.context ? "Waiting for YOU..." : `Status: ${state.phase}`;

                // --- Score Tug of War Logic ---
                const scoreUs = state.scores ? state.scores[0] : 0;
                const scoreThem = state.scores ? state.scores[1] : 0;
                const diff = scoreUs - scoreThem;

                // Clamp diff for visual: +/- 1000 points usually max swing
                // 0 diff = 50% left.
                // +500 = 100% left? Or marker moves right for us?
                // Standard: Left is 0%, Right is 100%.
                // Let's say Center (50%) is 0 diff.
                // If Us > Them, marker moves RIGHT (towards "Victory"?) 
                // Or "Us" is Left side? The bar is green on left.
                // Let's define: Green Bar expands from Left. Red Bar expands from Right.
                // Marker stays in middle or moves?

                // Let's do a sliding scale.
                // Range: -500 to +500.
                const range = 1000;
                let percent = 50 + ((diff / range) * 50);
                percent = Math.max(5, Math.min(95, percent)); // Clamp 5-95%

                document.getElementById('tow-marker').style.left = `${percent}%`;

                // Dynamic Fills (Optional, purely based on marker)
                document.getElementById('tow-left').style.width = `${percent}%`;
                document.getElementById('tow-right').style.width = `${100 - percent}%`;

                // Popuplate Bid History (Always visible in Info Panel)
                const blog = document.getElementById('bid-log');
                if (state.bid_history && state.bid_history.length > 0) {
                    blog.innerHTML = "<strong>Bidding:</strong><br>" + state.bid_history.join('<br>');
                } else {
                    blog.innerHTML = "";
                }

                // Highlight Active Player & Dealer
                const dealerIdx = state.dealer !== undefined ? state.dealer : -1;

                for (let i = 0; i < 4; i++) {
                    const plDiv = document.querySelector(`.p${i} .name`);
                    let nameText = plDiv.getAttribute('data-base-name'); // Store base name to avoid Dealer Dealer Dealer
                    if (!nameText) {
                        nameText = plDiv.innerText.replace(" (DEALER)", "").trim();
                        plDiv.setAttribute('data-base-name', nameText);
                    }

                    let displayText = nameText;
                    if (dealerIdx === i) {
                        displayText += " <span style='background:gold;color:black;border-radius:3px;padding:0 2px;font-size:10px;'>DEALER</span>";
                    }
                    plDiv.innerHTML = displayText;

                    if (state.active_player === i) {
                        plDiv.style.borderBottom = "3px solid #e74c3c";
                        plDiv.style.color = "#f1c40f";
                    } else {
                        plDiv.style.borderBottom = "none";
                        plDiv.style.color = "white";
                    }
                }

                // Render Hands
                if (state.hands) {
                    for (let i = 0; i < 4; i++) {
                        const hDiv = document.getElementById(`h${i}`);
                        const hand = state.hands[i];

                        // Simple Diffing to prevent re-render flicker/hover reset
                        const handStr = JSON.stringify(hand);
                        if (hDiv.dataset.lastHand !== handStr) {
                            hDiv.innerHTML = ''; // Clear
                            hDiv.dataset.lastHand = handStr; // Update State

                            if (Array.isArray(hand)) {
                                hand.forEach((c, idx) => {
                                    const cardEl = renderCard(c, idx, i === 0);
                                    hDiv.appendChild(cardEl);

                                    // Re-apply selection state if human
                                    if (i === 0 && selectedDiscards.includes(idx)) {
                                        cardEl.style.border = "2px solid red";
                                        cardEl.style.transform = "translateY(-20px)";
                                    }
                                });
                            }
                        } else {
                            // Even if we don't re-render, we must ensure selection state is visual
                            // This handles the case where user clicks (updates selection var) -> state update comes (no change) -> we must not lose selection visual
                            // Actually, onCardClick updates visual immediately. 
                            // So if we DON'T re-render, visual stays correct.
                            // The only edge case is if server sends same hand but we wanted to clear selection? 
                            // But selection is client-side state until submitted. So this is fine.
                        }
                    }
                }

                // Render Trick with Animations
                const trickArea = document.getElementById('trick-area');
                const lastTrickStr = trickArea.dataset.lastTrick || "[]";
                const currentTrickStr = JSON.stringify(state.trick || []);

                if (lastTrickStr !== currentTrickStr) {
                    const oldTrick = JSON.parse(lastTrickStr);
                    const newTrick = state.trick || [];

                    if (newTrick.length === 0 && oldTrick.length > 0) {
                        // Trick finished and cleared (Next Trick)
                        Array.from(trickArea.children).forEach(child => {
                            child.style.transition = "all 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045)";
                            child.style.transform = "scale(0) translateY(-200px) rotate(30deg)";
                            child.style.opacity = "0";
                        });
                        setTimeout(() => {
                            // Verify state hasn't changed to a NEW trick already
                            if (JSON.stringify(state.trick || []) === "[]") {
                                trickArea.innerHTML = '';
                            }
                        }, 500);
                    } else if (newTrick.length < oldTrick.length && newTrick.length > 0) {
                        // Re-render completely if something weird happened (data sync)
                        trickArea.innerHTML = '';
                        newTrick.forEach((tData) => {
                            const cDiv = renderCard(tData.card, -1, false, true);
                            cDiv.className += ` trick-card tc-${tData.player}`;
                            trickArea.appendChild(cDiv);
                        });
                    } else {
                        // Trick is growing or newly started
                        if (oldTrick.length === 0) trickArea.innerHTML = '';

                        // Add only the NEW cards with a stagger
                        let newCardsCount = 0;
                        newTrick.forEach((tData, idx) => {
                            if (idx >= oldTrick.length) {
                                const delay = newCardsCount * 400; // 400ms stagger between cards
                                newCardsCount++;

                                setTimeout(() => {
                                    const cDiv = renderCard(tData.card, -1, false, true);
                                    cDiv.className += ` trick-card tc-${tData.player} fly-${tData.player}`;
                                    trickArea.appendChild(cDiv);
                                }, delay);
                            }
                        });
                    }
                    trickArea.dataset.lastTrick = currentTrickStr;
                }

                // Update Round Status with Goal
                if (state.tricks_won) {
                    const team0Tricks = (state.tricks_won[0] || 0) + (state.tricks_won[2] || 0);
                    const team1Tricks = (state.tricks_won[1] || 0) + (state.tricks_won[3] || 0);

                    let statusText = `Tricks: You ${team0Tricks} - ${team1Tricks} Enemy`;
                    if (state.contract_goal && state.contract_goal > 0) {
                        const isTeam0Contract = state.contract_team_idx === 0;
                        const goal = state.contract_goal;

                        if (isTeam0Contract) {
                            statusText = `Contract: YOU need ${goal}<br>Progress: <span style="color:#2ecc71">${team0Tricks}</span> / ${goal}`;
                        } else {
                            statusText = `Contract: ENEMY needs ${goal}<br>Progress: <span style="color:#e74c3c">${team1Tricks}</span> / ${goal}`;
                        }
                    }
                    document.getElementById('round-status').innerHTML = statusText;
                }

                // Populate Trick History
                const tlog = document.getElementById('trick-log');
                if (state.finished_tricks && state.finished_tricks.length > 0) {
                    let html = "";
                    state.finished_tricks.forEach((trick, idx) => {
                        let cardsHtml = "";

                        const suitEmojis = {
                            'HEARTS': '❤️',
                            'DIAMONDS': '♦️',
                            'CLUBS': '♣️',
                            'SPADES': '♠️',
                            'NO_TRUMP': '🃏'
                        };

                        trick.cards.forEach((c, cIdx) => {
                            const pName = c[0];
                            const cStr = c[1];
                            const cRank = c[2];
                            const cSuit = c[3];

                            let emoji = suitEmojis[cSuit] || '';
                            if (cRank === 'JOKER') emoji = '🃏';

                            let color = (cSuit === 'HEARTS' || cSuit === 'DIAMONDS') ? '#e74c3c' : '#ecf0f1';
                            if (cSuit === 'NO_TRUMP' || cRank === 'JOKER') color = '#9b59b6';

                            let pStyle = "";
                            let cardIcon = "";
                            // Check if this specific card (str match) is the winning card for this player
                            if (pName === trick.winner && cStr === trick.winning_card) {
                                pStyle = "font-weight:bold; color:#f1c40f;";
                                cardIcon = " ⭐";
                            }

                            const isLead = (cIdx === 0) ? ' <span style="opacity:0.6; font-size:9px;">(Lead)</span>' : '';

                            cardsHtml += `<div style="font-size:11px; margin-bottom:3px; display:flex; justify-content:space-between; align-items:center;">
                                <span style="${pStyle}">${pName}${isLead}:</span> 
                                <span style="color:${color}; display:flex; align-items:center; gap:4px;">
                                    ${emoji} ${cStr}${cardIcon}
                                </span>
                             </div>`;
                        });

                        html += `<div class="trick-item" onmouseenter="showTrickTooltip(event, ${idx})" onmouseleave="hideTrickTooltip()">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-size:12px;">Trick ${idx + 1}: <span style="color:#f1c40f; font-weight:bold;">${trick.winner}</span></span>
                                <span style="font-size:10px; opacity:0.7;">w/ ${trick.winning_card}</span>
                            </div>
                         </div>`;
                    });
                    tlog.innerHTML = html;
                    tlog.scrollTop = tlog.scrollHeight;
                }
                else {
                    tlog.innerHTML = "<span style='opacity:0.5; font-size:11px;'>No tricks played yet.</span>";
                }

                // Handle Action State
                const panel = document.getElementById('action-panel');
                const bidControls = document.getElementById('bid-controls');
                const playMsg = document.getElementById('play-msg');
                const kittyControls = document.getElementById('kitty-controls');
                const nextControls = document.getElementById('next-trick-controls');

                if (state.waiting_for_next) {
                    // Show Round Result Modal ONLY if 10 tricks done (Round Over)
                    if (state.finished_tricks && state.finished_tricks.length === 10) {
                        const t0 = state.tricks_won[0] + state.tricks_won[2];
                        const t1 = state.tricks_won[1] + state.tricks_won[3];
                        const winnerTeam = t0 > t1 ? "Your Team" : "Enemy Team";
                        const winnerColor = t0 > t1 ? "#2ecc71" : "#e74c3c";

                        document.getElementById('modal-status').innerHTML = `
                            Final Count: <span style="color:#2ecc71">${t0}</span> - <span style="color:#e74c3c">${t1}</span><br>
                            Winner: <span style="color:${winnerColor}; font-weight:bold;">${winnerTeam}</span>
                        `;
                        document.getElementById('round-result-modal').style.display = 'block';

                        // Hide sidebar next button in this case, use modal button instead
                        nextControls.style.display = 'none';
                    } else {
                        // Regular trick pause (1-9)
                        document.getElementById('round-result-modal').style.display = 'none';
                        nextControls.style.display = 'block';
                    }

                    // Show panel
                    panel.style.display = 'block';
                    document.getElementById('action-title').innerText = "Round Status";
                    document.getElementById('error-display').style.display = 'none';

                    bidControls.style.display = 'none';
                    playMsg.style.display = 'none';
                    kittyControls.style.display = 'none';

                } else {
                    // Hide the modal when not waiting for next
                    document.getElementById('round-result-modal').style.display = 'none';

                    if (pending.context) {
                        panel.style.display = 'block';
                        pendingContext = pending.context;

                        const errDisp = document.getElementById('error-display');
                        if (pending.error) {
                            errDisp.innerText = pending.error;
                            errDisp.style.display = 'block';
                        } else {
                            errDisp.style.display = 'none';
                        }

                        bidControls.style.display = 'none';
                        playMsg.style.display = 'none';
                        kittyControls.style.display = 'none';
                        nextControls.style.display = 'none';

                        if (pending.context === 'BID') {
                            // Extract current bid from pending data if available (WebHumanPlayer sends it)
                            let bidText = "None";
                            if (pending.data && pending.data.current_bid) {
                                bidText = pending.data.current_bid;
                            }

                            document.getElementById('action-title').innerText = `Make Your Bid (Beat: ${bidText})`;


                            bidControls.style.display = 'block';
                        } else if (pending.context === 'PLAY') {
                            document.getElementById('action-title').innerText = "Play a Card";
                            playMsg.style.display = 'block';
                        } else if (pending.context === 'KITTY') {
                            document.getElementById('action-title').innerText = "Discard 3 Cards";
                            kittyControls.style.display = 'block';
                        }
                    } else {
                        panel.style.display = 'none';
                        pendingContext = null;
                    }
                }

            } catch (e) {
                console.error(e);
            }
            setTimeout(updateState, 500);
        }

        updateState();
    </script>
    <div id="global-trick-tooltip" class="trick-tooltip"></div>

    <div id="round-result-modal">
        <div class="modal-content">
            <div class="modal-title">Round Results</div>
            <div class="modal-body" id="modal-status">
                Final Count: 6 - 4<br>
                Winner: Your Team
            </div>
            <button class="modal-btn" onclick="submitNextTrick()">Continue to Next Round ➡️</button>
        </div>
    </div>
</body>

</html>
